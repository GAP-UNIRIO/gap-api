spring:
  application:
    name: gap-api

  datasource:
    url: jdbc:postgresql://localhost:5432/core_api_test
    username: testuser
    password: testpassword
  jpa:
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${DEV_GOOGLE_CLIENT_ID}
            client-secret: ${DEV_GOOGLE_CLIENT_SECRET}
server:
  servlet:
    context-path: /api

app:
  security:
    allowed-domains: "edu.unirio.br,uniriotec.br"
    frontend-url: "http://localhost:8080/api"