spring:
  application:
    name: gap-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
server:
  servlet:
    context-path: /api
app:
  security:
    allowed-domains: ${ALLOWED_DOMAINS}
    frontend-url: ${FRONTEND_URL}
  storage:
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:us-east-1}
      temporary-prefix: ${AWS_S3_TEMPORARY_PREFIX:temporary}
      orders-prefix: ${AWS_S3_ORDERS_PREFIX:orders}
      upload-key-secret: ${AWS_S3_UPLOAD_KEY_SECRET:}
