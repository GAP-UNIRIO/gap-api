name: building-docker

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 11d5960a326750d5838078e36cf38b85af677262

      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build App
        run: ./gradlew clean build -x test

      - name: Auth to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # ca07.4.02bb7.4.04ab0790a636c9b7.4.0f2267.4.002c73d7.4.047a27.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gap-api:latest
            ${{ secrets.DOCKER_USERNAME }}/gap-api:${{ github.sha }}

      - name: Trigger Render Deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -X POST $DEPLOY_HOOK_URL

