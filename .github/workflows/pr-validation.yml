name: PR Validation

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permite execução manual caso necessário

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    permissions:
      checks: write
      pull-requests: write
      contents: read

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: core_api_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Necessário para o SonarCloud calcular o New Code corretamente

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Restore vulnerability database cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Scan for exposed secrets (Gitleaks)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.30.0 \
            detect --source /repo --no-git --redact

      - name: Format, test, coverage, dependency, and SonarQube checks
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/core_api_test
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpassword
          SPRING_PROFILES_ACTIVE: test
          DEV_GOOGLE_CLIENT_ID: ${{secrets.DEV_GOOGLE_CLIENT_ID}}
          DEV_GOOGLE_CLIENT_SECRET: ${{secrets.DEV_GOOGLE_CLIENT_SECRET}}
        run: >
          ./gradlew check sonar
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.projectName=${{ vars.SONAR_PROJECT_NAME }}
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION_KEY }}
          -Dsonar.host.url=${{ vars.SONAR_HOST_URL }}
          -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
          -Dsonar.qualitygate.wait=true

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3
        if: always()
        with:
          files: '**/build/test-results/test/TEST-*.xml'

      - name: Publish JaCoCo coverage (Artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/
